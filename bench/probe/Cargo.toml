# Its own workspace, so `cargo test` never builds GPUI. Cargo.lock is the
# lockfile that docs/research/notes/05 ran.
[package]
name = "summon-probe"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "wayland", "runtime_shaders"] }
libc = "0.2"
env_logger = "0.11"
futures = "0.3"
