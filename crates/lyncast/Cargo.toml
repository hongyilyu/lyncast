[package]
name = "lyncast"
description = "A fast, small launcher for niri: apps, clipboard history, and an inline calculator."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
lyncast-core.workspace = true
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
